services:
  postgres:
    image: postgres:16-alpine
    container_name: sync-engine-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-scryme_sync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scryme_sync}"]
      interval: 5s
      timeout: 5s
      retries: 5

  sync-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sync-engine-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-scryme_sync}?schema=public
    ports:
      - "${PORT:-3000}:3000"

volumes:
  postgres_data:
