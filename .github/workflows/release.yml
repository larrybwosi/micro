name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows-release:
    name: Build & Release Windows App (MSI)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Auto bump version if tag exists
        shell: bash
        run: |
          git fetch --tags
          ORIGINAL_VERSION=$(node -p "require('./package.json').version")
          CURRENT_VERSION="$ORIGINAL_VERSION"
          TAG_NAME="v${CURRENT_VERSION}"

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            while git rev-parse "$TAG_NAME" >/dev/null 2>&1 || git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; do
              echo "Tag $TAG_NAME already exists. Bumping patch version..."
              npm run version:bump patch
              CURRENT_VERSION=$(node -p "require('./package.json').version")
              TAG_NAME="v${CURRENT_VERSION}"
            done

            if [ "$CURRENT_VERSION" != "$ORIGINAL_VERSION" ]; then
              echo "Bumped version from $ORIGINAL_VERSION to $CURRENT_VERSION"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
              git commit -m "chore: bump version to $CURRENT_VERSION [skip ci]"
              git tag "v${CURRENT_VERSION}"
              git push origin main --tags || true
            else
              echo "Proceeding with version $CURRENT_VERSION"
            fi
          else
            echo "Proceeding with version $CURRENT_VERSION (triggered by tag)"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: 'v__VERSION__'
          releaseName: 'scryme micro v__VERSION__'
          releaseBody: 'Automated release for scryme micro'
          releaseDraft: false
          prerelease: false
